services:
  postgres:
    image: postgres:16-alpine
    container_name: uniflow-postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-uniflow}
      POSTGRES_USER: ${POSTGRES_USER:-uniflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env ou ambiente}
      TZ: UTC
      PGTZ: UTC
    volumes:
      - uniflow_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-uniflow} -d ${POSTGRES_DB:-uniflow}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  uniflow_postgres_data:
